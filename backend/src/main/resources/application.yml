spring:
  application:
    name: eyeon
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/eyeon}
    username: ${SPRING_DATASOURCE_USERNAME:eyeon}
    password: ${SPRING_DATASOURCE_PASSWORD:eyeon_dev}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      timeout: 30000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

server:
  port: 8081
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

eyeon:
  share:
    # Public host used to build share-location links (/share/{token}).
    base-url: ${EYEON_SHARE_BASE_URL:https://eyeongps.com}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-local-dev-32bytes}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  netty:
    tcp-port: ${NETTY_TCP_PORT:5024}
    boss-threads: 1
    worker-threads: 4
    idle-read-seconds: 600
  seed:
    enabled: ${EYEON_SEED_ENABLED:false}
    admin-email: ${EYEON_SEED_ADMIN_EMAIL:admin@eyeon.local}
    admin-password: ${EYEON_SEED_ADMIN_PASSWORD:changeme}
  sms:
    # SSL Wireless transactional SMS (CLAUDE.md §12.2). Blank token = log-only stub.
    url: https://smsplus.sslwireless.com/api/v3/send-sms
    api-token: ${SSL_SMS_API_TOKEN:}
    sender-id: ${SSL_SMS_SENDER_ID:EYEON}
  push:
    # Alarm push notifications via the Expo Push Service (relays to FCM/APNs).
    enabled: ${EYEON_PUSH_ENABLED:true}
    expo-url: https://exp.host/--/api/v2/push/send
    # Optional Expo access token (Expo dashboard → Access tokens); blank = unauthenticated.
    access-token: ${EYEON_EXPO_ACCESS_TOKEN:}
  # Cell tower location APIs for GSM-based location when GPS is unavailable.
  # UnwiredLabs: https://unwiredlabs.com (100 free requests/day, better accuracy)
  # OpenCellID: https://opencellid.org (free, unlimited with API key)
  unwiredlabs:
    api-key: ${EYEON_UNWIREDLABS_API_KEY:}
  opencellid:
    api-key: ${EYEON_OPENCELLID_API_KEY:}

logging:
  level:
    root: INFO
    com.webinnovation.eyeon: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
