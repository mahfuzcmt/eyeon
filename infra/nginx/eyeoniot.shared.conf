# EyeOn on its own domain, eyeoniot.com (2026-11-21), behind the shared front-door nginx
# (edge-nginx on 103.159.37.145; see docs/DEPLOYMENT.md "Shared server"). Replaces eyeon.conf.
#
#   eyeoniot.com          the site, the REST API (/api/v1) and the live feed (/api/v1/ws)
#   www.eyeoniot.com      -> https://eyeoniot.com
#   eyeon.motolinkgps.com keeps answering /api/v1 and /api/v1/ws for apps built before the move
#                         (0.3.29 and older call it directly); its pages redirect to eyeoniot.com.
#                         Its DNS record must stay: trackers and watches dial
#                         eyeon.motolinkgps.com:5024 (raw TCP, not through nginx) until each one
#                         is re-pointed with SERVER,1,eyeoniot.com,5024,0#.
#
# Upstreams are variables resolved through Docker's DNS at request time, never static names:
# with a static name nginx refuses to start while EyeOn is down and takes every other site on
# this nginx with it. Requires edge-nginx to be attached to `eyeon_default`.

map $http_upgrade $connection_upgrade_eyeon {
    default upgrade;
    ''      close;
}

# ---- plain HTTP: certificate challenges, then HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name eyeoniot.com www.eyeoniot.com eyeon.motolinkgps.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- www -> apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eyeoniot.com;

    ssl_certificate     /etc/letsencrypt/live/eyeoniot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eyeoniot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://eyeoniot.com$request_uri;
}

# ---- the old name: API and live feed for older apps, pages move to the new name ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eyeon.motolinkgps.com;

    ssl_certificate     /etc/letsencrypt/live/eyeon.motolinkgps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eyeon.motolinkgps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $eyeon_backend http://eyeon-backend:8081;

    location ~ ^/api/v1/ws {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_eyeon;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location /api/v1/ {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location / {
        return 301 https://eyeoniot.com$request_uri;
    }
}

# ---- eyeoniot.com: everything ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eyeoniot.com;

    ssl_certificate     /etc/letsencrypt/live/eyeoniot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eyeoniot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $eyeon_backend  http://eyeon-backend:8081;
    set $eyeon_frontend http://eyeon-frontend:3001;

    # WebSocket (STOMP) — /api/v1/ws and /api/v1/ws/...
    location ~ ^/api/v1/ws {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_eyeon;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Backend REST (the mobile app calls this directly; the web dashboard goes through /api/proxy)
    location /api/v1/ {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Dashboard (Next.js)
    location / {
        proxy_pass $eyeon_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
    }
}
