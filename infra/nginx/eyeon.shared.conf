# EyeOn behind a SHARED front-door nginx container (docs/DEPLOYMENT.md "Shared server").
# Drop into that container's conf.d. The container must be attached to `eyeon_default`:
#   docker network connect eyeon_default <nginx-container>
#
# Upstreams are variables resolved through Docker's DNS at request time, NOT static names.
# With a static `proxy_pass http://eyeon-backend:8081` nginx refuses to START when the name
# cannot be resolved (EyeOn stopped, network not attached) and would take every other site
# on this nginx down with it. With a variable the worst case is a 502 for EyeOn only.
#
# Replace eyeon.motolinkgps.com with the real hostname if it changes.

map $http_upgrade $connection_upgrade_eyeon {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name eyeon.motolinkgps.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eyeon.motolinkgps.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eyeon.motolinkgps.com;

    ssl_certificate     /etc/letsencrypt/live/eyeon.motolinkgps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eyeon.motolinkgps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $eyeon_backend  http://eyeon-backend:8081;
    set $eyeon_frontend http://eyeon-frontend:3001;

    # WebSocket (STOMP) — /api/v1/ws and /api/v1/ws/...
    location ~ ^/api/v1/ws {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_eyeon;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Backend REST (the mobile app calls this directly; the web dashboard goes through /api/proxy)
    location /api/v1/ {
        proxy_pass $eyeon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Dashboard (Next.js)
    location / {
        proxy_pass $eyeon_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
    }
}
