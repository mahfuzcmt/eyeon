<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep brand-blue background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3257"/>
      <stop offset="55%" stop-color="#134472"/>
      <stop offset="100%" stop-color="#175389"/>
    </linearGradient>

    <!-- Grid pattern for map effect -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(138, 190, 235, 0.12)" stroke-width="1"/>
    </pattern>

    <!-- Smaller grid for detail -->
    <pattern id="gridSmall" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="rgba(138, 190, 235, 0.06)" stroke-width="0.5"/>
    </pattern>

    <!-- Radial gradient for glow effect -->
    <radialGradient id="glowCenter" cx="30%" cy="40%" r="60%" fx="30%" fy="40%">
      <stop offset="0%" stop-color="rgba(43, 130, 212, 0.15)"/>
      <stop offset="50%" stop-color="rgba(43, 130, 212, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="glowSecondary" cx="75%" cy="70%" r="50%" fx="75%" fy="70%">
      <stop offset="0%" stop-color="rgba(77, 167, 77, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Route line gradient -->
    <linearGradient id="routeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(43, 130, 212, 0.3)"/>
      <stop offset="50%" stop-color="rgba(43, 130, 212, 0.5)"/>
      <stop offset="100%" stop-color="rgba(43, 130, 212, 0.2)"/>
    </linearGradient>

    <linearGradient id="routeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(77, 167, 77, 0.2)"/>
      <stop offset="50%" stop-color="rgba(77, 167, 77, 0.4)"/>
      <stop offset="100%" stop-color="rgba(77, 167, 77, 0.1)"/>
    </linearGradient>

    <!-- Location marker symbol -->
    <symbol id="marker" viewBox="0 0 24 36">
      <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24c0-6.6-5.4-12-12-12zm0 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6z" fill="currentColor"/>
    </symbol>

    <!-- Pulse animation for markers -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Grid layers -->
  <rect width="100%" height="100%" fill="url(#gridSmall)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Glow effects -->
  <rect width="100%" height="100%" fill="url(#glowCenter)"/>
  <rect width="100%" height="100%" fill="url(#glowSecondary)"/>

  <!-- Abstract route lines -->
  <g opacity="0.6">
    <!-- Main curved route -->
    <path d="M-50 800 Q 200 700, 400 650 T 800 500 T 1200 400 T 1600 300 T 2000 150"
          fill="none" stroke="url(#routeGrad1)" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary route -->
    <path d="M-50 900 Q 300 850, 500 750 T 900 600 T 1300 500 T 1700 450 T 2000 350"
          fill="none" stroke="url(#routeGrad2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,4"/>

    <!-- Connecting route -->
    <path d="M200 1100 Q 400 950, 600 800 T 1000 600 T 1400 450"
          fill="none" stroke="rgba(43, 130, 212, 0.25)" stroke-width="2" stroke-linecap="round"/>

    <!-- Branch routes -->
    <path d="M800 500 Q 850 450, 900 350 T 1000 200"
          fill="none" stroke="rgba(43, 130, 212, 0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1200 400 Q 1250 300, 1350 250 T 1500 100"
          fill="none" stroke="rgba(43, 130, 212, 0.15)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Location markers -->
  <g filter="url(#glow)">
    <!-- Active tracking marker (green) -->
    <use href="#marker" x="780" y="470" width="24" height="36" color="rgba(77, 167, 77, 0.8)"/>

    <!-- Route markers (blue) -->
    <use href="#marker" x="388" y="620" width="18" height="27" color="rgba(43, 130, 212, 0.6)"/>
    <use href="#marker" x="1185" y="370" width="18" height="27" color="rgba(43, 130, 212, 0.6)"/>
    <use href="#marker" x="1580" y="270" width="18" height="27" color="rgba(43, 130, 212, 0.5)"/>

    <!-- Distant markers (faded) -->
    <use href="#marker" x="580" y="770" width="14" height="21" color="rgba(43, 130, 212, 0.3)"/>
    <use href="#marker" x="990" y="580" width="14" height="21" color="rgba(43, 130, 212, 0.3)"/>
    <use href="#marker" x="1380" y="420" width="14" height="21" color="rgba(43, 130, 212, 0.3)"/>
  </g>

  <!-- Animated pulse circles around active marker -->
  <g opacity="0.5">
    <circle cx="792" cy="488" r="15" fill="none" stroke="rgba(77, 167, 77, 0.6)" stroke-width="2">
      <animate attributeName="r" from="15" to="40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="792" cy="488" r="15" fill="none" stroke="rgba(77, 167, 77, 0.4)" stroke-width="1.5">
      <animate attributeName="r" from="15" to="40" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.4" to="0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- GPS signal arcs (top right) -->
  <g transform="translate(1700, 120)" opacity="0.3">
    <path d="M0 60 Q 30 30, 60 0" fill="none" stroke="rgba(43, 130, 212, 0.5)" stroke-width="2"/>
    <path d="M0 80 Q 40 40, 80 0" fill="none" stroke="rgba(43, 130, 212, 0.4)" stroke-width="2"/>
    <path d="M0 100 Q 50 50, 100 0" fill="none" stroke="rgba(43, 130, 212, 0.3)" stroke-width="2"/>
  </g>

  <!-- Subtle compass rose (bottom left) -->
  <g transform="translate(120, 900)" opacity="0.15">
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(43, 130, 212, 0.5)" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(43, 130, 212, 0.3)" stroke-width="1"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="rgba(43, 130, 212, 0.4)" stroke-width="1"/>
    <line x1="-65" y1="0" x2="65" y2="0" stroke="rgba(43, 130, 212, 0.4)" stroke-width="1"/>
    <polygon points="0,-55 -5,-45 5,-45" fill="rgba(43, 130, 212, 0.5)"/>
    <text x="0" y="-70" text-anchor="middle" fill="rgba(43, 130, 212, 0.6)" font-size="12" font-family="sans-serif">N</text>
  </g>

  <!-- Coordinate grid labels (subtle) -->
  <g opacity="0.15" fill="rgba(43, 130, 212, 0.8)" font-size="10" font-family="monospace">
    <text x="60" y="25">23.8103°N</text>
    <text x="1800" y="25">90.4125°E</text>
    <text x="60" y="1065">Dhaka, Bangladesh</text>
  </g>

  <!-- Vignette overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)" opacity="0.4">
    <defs>
      <radialGradient id="vignette">
        <stop offset="50%" stop-color="transparent"/>
        <stop offset="100%" stop-color="#0E3257"/>
      </radialGradient>
    </defs>
  </rect>
</svg>
