services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: eyeon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eyeon}
      POSTGRES_USER: ${POSTGRES_USER:-eyeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eyeon_dev}
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 is PingPath)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eyeon} -d ${POSTGRES_DB:-eyeon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eyeon-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # host 6380 -> container 6379 (6379 is PingPath)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend and frontend services land here in Phase 1 / Phase 2 — see CLAUDE.md §15.1

volumes:
  postgres_data:
  redis_data:
